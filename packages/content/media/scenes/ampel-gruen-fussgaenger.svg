<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Ampel zeigt Grün, aber ein Fußgänger befindet sich noch auf der Fahrbahn."><title>Ampel zeigt Grün, aber ein Fußgänger befindet sich noch auf der Fahrbahn.</title><defs><marker id="ah-w" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/></marker><marker id="ah-c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FACC15"/></marker></defs><rect width="600" height="400" fill="#F3F4F6"/><g transform="translate(120 40) scale(1.5)"><rect x="0" y="0" width="68" height="196" rx="10" fill="#1F2937"/><circle cx="34" cy="38" r="24" fill="#374151" stroke="#111827" stroke-width="2"/><circle cx="34" cy="98" r="24" fill="#374151" stroke="#111827" stroke-width="2"/><circle cx="34" cy="158" r="24" fill="#00A651" stroke="#111827" stroke-width="2"/></g><text x="260" y="110" font-size="21" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#111827" text-anchor="start" >Grün, Fußgänger noch auf der Fahrbahn</text><text x="260" y="150" font-size="14" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="start" >Grün heißt: Fahren erlaubt, aber</text><text x="260" y="178" font-size="14" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="start" >Fußgänger dürfen die Fahrbahn zu Ende überqueren.</text><g transform="translate(470 250)"><g transform="translate(0 0)"><circle cx="0" cy="0" r="6" fill="#374151"/><rect x="-9" y="-3" width="18" height="6" rx="3" fill="#374151" opacity="0.7"/></g></g><rect x="400" y="290" width="160" height="50" fill="#5F6B7A"/><g fill="#FFFFFF"><rect x="410" y="295" width="14" height="40"/><rect x="440" y="295" width="14" height="40"/><rect x="470" y="295" width="14" height="40"/><rect x="500" y="295" width="14" height="40"/><rect x="530" y="295" width="14" height="40"/></g></svg>

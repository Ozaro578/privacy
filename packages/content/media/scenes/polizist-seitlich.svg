<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Ein Polizeibeamter steht Ihnen mit der Brust zugewandt und hat beide Arme seitlich ausgestreckt, also quer zu Ihrer Fahrtrichtung: Das bedeutet Halt vor der Kreuzung (wie Rot). Wer in Richtung der Arme fährt, hat freie Fahrt."><title>Ein Polizeibeamter steht Ihnen mit der Brust zugewandt und hat beide Arme seitlich ausgestreckt, also quer zu Ihrer Fahrtrichtung: Das bedeutet Halt vor der Kreuzung (wie Rot). Wer in Richtung der Arme fährt, hat freie Fahrt.</title><defs><marker id="ah-w" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/></marker><marker id="ah-c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FACC15"/></marker></defs><rect width="600" height="400" fill="#F3F4F6"/><g transform="translate(300 60)"><circle cx="0" cy="0" r="22" fill="#F5D0A9" stroke="#111827" stroke-width="2"/><path d="M-26 -8 Q0 -30 26 -8 L26 -2 H-26 Z" fill="#1E3A8A"/><rect x="-34" y="26" width="68" height="110" rx="14" fill="#1E3A8A"/><rect x="-150" y="40" width="116" height="22" rx="11" fill="#1E3A8A"/><rect x="34" y="40" width="116" height="22" rx="11" fill="#1E3A8A"/><rect x="-150" y="36" width="24" height="30" rx="6" fill="#FFFFFF" stroke="#111827"/><rect x="126" y="36" width="24" height="30" rx="6" fill="#FFFFFF" stroke="#111827"/><rect x="-30" y="136" width="24" height="90" rx="8" fill="#111827"/><rect x="6" y="136" width="24" height="90" rx="8" fill="#111827"/></g><text x="300" y="320" font-size="17" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#111827" text-anchor="middle" >Arme seitlich ausgestreckt, quer zu Ihrer Fahrtrichtung</text><text x="300" y="350" font-size="20" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#C1121C" text-anchor="middle" >= Halt vor der Kreuzung (wie Rot)</text><text x="300" y="380" font-size="13" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="middle" >Von vorn oder hinten gesehen: Halt. Von der Seite (in Armrichtung): frei.</text></svg>

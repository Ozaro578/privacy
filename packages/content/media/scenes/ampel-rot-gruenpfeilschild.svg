<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Rote Ampel mit Grünpfeilschild (Zeichen 720) rechts neben dem roten Licht."><title>Rote Ampel mit Grünpfeilschild (Zeichen 720) rechts neben dem roten Licht.</title><defs><marker id="ah-w" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/></marker><marker id="ah-c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FACC15"/></marker></defs><rect width="600" height="400" fill="#F3F4F6"/><g transform="translate(120 40) scale(1.5)"><rect x="0" y="0" width="68" height="196" rx="10" fill="#1F2937"/><circle cx="34" cy="38" r="24" fill="#E30613" stroke="#111827" stroke-width="2"/><circle cx="34" cy="98" r="24" fill="#374151" stroke="#111827" stroke-width="2"/><circle cx="34" cy="158" r="24" fill="#374151" stroke="#111827" stroke-width="2"/></g><text x="260" y="110" font-size="21" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#111827" text-anchor="start" >Rot mit Grünpfeilschild</text><text x="260" y="150" font-size="14" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="start" >Rechts abbiegen erst nach Anhalten,</text><text x="260" y="178" font-size="14" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="start" >wenn niemand behindert oder gefährdet wird.</text><svg x="470" y="60" width="90" height="90" viewBox="0 0 120 120"><title>Zeichen 720 Grünpfeilschild</title><rect x="2" y="2" width="116" height="116" rx="10" fill="#111111" stroke="#9CA3AF" stroke-width="1"/><path d="M26 50 H66 V30 L96 60 L66 90 V70 H26 Z" fill="#008351" stroke="#FFFFFF" stroke-width="3"/></svg></svg>

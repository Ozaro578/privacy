<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Schema Anhalteweg: Der Anhalteweg besteht aus dem Reaktionsweg (Fahrzeug fährt noch ungebremst weiter) und dem Bremsweg."><title>Schema Anhalteweg: Der Anhalteweg besteht aus dem Reaktionsweg (Fahrzeug fährt noch ungebremst weiter) und dem Bremsweg.</title><defs><marker id="ah-w" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/></marker><marker id="ah-c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#FACC15"/></marker></defs><rect width="600" height="300" fill="#F3F4F6"/><rect x="0" y="120" width="600" height="90" fill="#5F6B7A"/><path d="M0 120 H600 M0 210 H600" stroke="#FFFFFF" stroke-width="3"/><g transform="translate(70 165) rotate(90)"><rect x="-14" y="-28" width="28" height="56" rx="7" fill="#1D4ED8" stroke="#111827" stroke-width="1.5"/><rect x="-10" y="-16" width="20" height="9" rx="2" fill="#BFDBFE" opacity="0.9"/><rect x="-10" y="14" width="20" height="6" rx="2" fill="#BFDBFE" opacity="0.7"/></g><rect x="100" y="230" width="180" height="14" rx="4" fill="#FACC15"/><rect x="280" y="230" width="260" height="14" rx="4" fill="#C1121C"/><text x="190" y="270" font-size="14" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#111827" text-anchor="middle" >Reaktionsweg</text><text x="190" y="288" font-size="12" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="middle" >(km/h ÷ 10) × 3</text><text x="410" y="270" font-size="14" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#111827" text-anchor="middle" >Bremsweg</text><text x="410" y="288" font-size="12" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="middle" >(km/h ÷ 10)²  ·  Gefahrenbremsung: ÷ 2</text><path d="M100 60 H540" stroke="#111827" stroke-width="2" marker-end="url(#ah-c)"/><path d="M100 52 V68" stroke="#111827" stroke-width="2"/><text x="320" y="48" font-size="16" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#111827" text-anchor="middle" >Anhalteweg = Reaktionsweg + Bremsweg</text><circle cx="100" cy="165" r="0"/><text x="70" y="105" font-size="12" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="middle" >Gefahr erkannt</text><path d="M540 130 V200" stroke="#FFFFFF" stroke-width="4"/><text x="540" y="105" font-size="12" font-family="'DIN Alternate','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#374151" text-anchor="middle" >Stillstand</text></svg>

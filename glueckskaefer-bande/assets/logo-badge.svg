<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Glückskäfer Bande – Kindertagespflege in Ostfildern-Kemnat">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#F6E9DD"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EE5A45"/><stop offset="1" stop-color="#C62F22"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9BBE4A"/><stop offset="1" stop-color="#5E8A2A"/></linearGradient>
    <symbol id="heart" viewBox="0 0 24 22"><path d="M12 21s-9-5.6-9-12A5 5 0 0 1 12 6a5 5 0 0 1 9 3c0 6.4-9 12-9 12z"/></symbol>
    <symbol id="daisy" viewBox="0 0 30 30"><g fill="#fff"><circle cx="15" cy="5" r="4.5"/><circle cx="25" cy="12" r="4.5"/><circle cx="22" cy="24" r="4.5"/><circle cx="8" cy="24" r="4.5"/><circle cx="5" cy="12" r="4.5"/></g><circle cx="15" cy="15" r="5" fill="#F2B632"/></symbol>
  </defs>
  <circle cx="300" cy="300" r="292" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="286" fill="none" stroke="#C9A961" stroke-width="3"/>
  <circle cx="300" cy="300" r="276" fill="none" stroke="#C9A961" stroke-width="1.2" opacity=".7"/>
  <!-- Gras -->
  <g stroke="#7E9A3C" stroke-width="7" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M70 330c10-30 10-60 4-80"/><path d="M95 335c12-26 18-50 14-75"/><path d="M120 345c6-25 20-45 38-58"/>
    <path d="M520 330c-8-30-8-60-2-80"/><path d="M495 335c-10-26-18-50-14-75"/><path d="M470 345c-6-25-20-45-38-58"/>
    <path d="M150 360c4-18 16-30 30-38"/><path d="M450 360c-4-18-16-30-30-38"/>
  </g>
  <g stroke="#9BBE4A" stroke-width="6" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M80 345c6-18 4-35-4-50"/><path d="M505 345c-6-18-4-35 4-50"/><path d="M200 355c-2-20 6-34 16-44"/><path d="M400 355c2-20-6-34-16-44"/>
  </g>
  <!-- Blatt -->
  <path d="M120 350c60-60 220-70 370-25-70 60-250 70-370 25z" fill="url(#leaf)"/>
  <path d="M135 345c80-30 220-45 345-22" stroke="#4F7320" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- Fühler mit Herzen -->
  <path d="M275 165c-10-30-30-50-55-58M330 165c10-30 30-50 55-58" stroke="#2F2A26" stroke-width="7" fill="none" stroke-linecap="round"/>
  <use href="#heart" x="194" y="84" width="40" height="36" fill="#D7402F"/>
  <use href="#heart" x="366" y="84" width="40" height="36" fill="#D7402F"/>
  <!-- Körper -->
  <path d="M170 270a132 118 0 0 1 264 0v10a132 90 0 0 1-264 0z" fill="url(#body)"/>
  <ellipse cx="240" cy="205" rx="30" ry="14" fill="#fff" opacity=".35" transform="rotate(-25 240 205)"/>
  <path d="M302 165v200" stroke="#2F2A26" stroke-width="8" stroke-linecap="round"/>
  <g fill="#2F2A26">
    <circle cx="250" cy="215" r="17"/><circle cx="356" cy="215" r="17"/>
    <circle cx="218" cy="270" r="14"/><circle cx="388" cy="270" r="14"/>
    <circle cx="262" cy="320" r="12"/><circle cx="344" cy="320" r="12"/>
  </g>
  <!-- Kopf & Gesicht -->
  <circle cx="302" cy="168" r="46" fill="#2F2A26"/>
  <circle cx="302" cy="182" r="34" fill="#F8D9C4"/>
  <path d="M283 180c6-7 14-7 20 0M317 180c-6-7-14-7-20 0" stroke="#2F2A26" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M290 195c7 8 17 8 24 0" stroke="#2F2A26" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="276" cy="192" r="7" fill="#F0A090" opacity=".8"/><circle cx="328" cy="192" r="7" fill="#F0A090" opacity=".8"/>
  <!-- Blümchen & Herzen -->
  <use href="#daisy" x="100" y="300" width="40" height="40"/><use href="#daisy" x="455" y="298" width="44" height="44"/><use href="#daisy" x="160" y="335" width="26" height="26"/>
  <g fill="#D7402F" opacity=".85">
    <use href="#heart" x="120" y="180" width="26" height="24"/><use href="#heart" x="455" y="205" width="22" height="20"/>
    <use href="#heart" x="140" y="235" width="16" height="15"/><use href="#heart" x="440" y="160" width="18" height="16"/>
  </g>
  <path d="M410 205c20-30 60-30 65 0" stroke="#2F2A26" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity=".6"/>

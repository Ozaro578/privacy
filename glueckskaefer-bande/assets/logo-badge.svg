  <g font-family="Fredoka, Nunito, Arial Rounded MT Bold, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <text x="300" y="450" font-size="74" letter-spacing="2"><tspan fill="#D7402F">GLÜCKS</tspan><tspan fill="#5E8A2A">KÄFER</tspan></text>
    <text x="300" y="505" font-size="46" fill="#2F2A26" letter-spacing="10">BANDE</text>
    <text x="300" y="540" font-size="20" fill="#5B534B" font-weight="500" letter-spacing="3">Kindertagespflege</text>
    <text x="300" y="565" font-size="19" fill="#5B534B" font-weight="500" letter-spacing="1">in Ostfildern-Kemnat</text>
  </g>
  <path d="M225 495h40M335 495h40" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
  <use href="#heart" x="270" y="482" width="16" height="15" fill="#D7402F"/><use href="#heart" x="314" y="482" width="16" height="15" fill="#D7402F"/>

# =====================================================================
#  Kanal 2: "Baby of Wall Street" – KI-Baby-Comedy (englisch, wiederkehrende Figur)
#  Start:  python make_short.py --config config.baby.yaml run --no-upload
# =====================================================================

channel:
  name: "Baby of Wall Street"
  handle: "@BabyOfWallStreet"
  language: "en"
  audience: "allgemein"
  niche: >
    AI baby comedy with ONE recurring character: Bo, "the Baby of Wall Street", a chubby
    one-year-old who acts like a ruthless finance boss. Every short is a "POV" situation:
    Bo closes a deal, fires the CFO, survives a Monday meeting, negotiates a raise, rings
    the stock exchange bell, runs a hedge fund from his high chair. Second series: Bo
    "after hours" in normal adult life (gym, taxes, dating app, moving, cooking). Dry,
    absurd, wholesome humor. Visual gags first, very few words. No cruelty, no danger
    for the baby, no adult themes, no real brands, no real financial advice.
  topics:
    - "POV: the Baby of Wall Street on a Monday"
    - "POV: your baby closes a million dollar deal"
    - "POV: your baby fires the CFO"
    - "POV: your baby negotiates a raise"
    - "POV: your baby rings the opening bell"
    - "POV: your baby runs a hedge fund from a high chair"
    - "POV: your baby's first day at the bank"
    - "POV: your baby has a job interview at Wall Street"
    - "POV: your baby checks the stock market at 6 a.m."
    - "POV: your baby buys the company"
    - "POV: your baby explains the budget to the board"
    - "POV: your baby's meeting could have been an email"
    - "POV: your baby takes a business lunch"
    - "POV: your baby's IPO day"
    - "POV: your baby does the quarterly review"
    - "POV: your baby after hours at the gym"
    - "POV: your baby does taxes at midnight"
    - "POV: your baby is moving into a penthouse"
    - "POV: your baby's private jet has no milk"
    - "POV: your baby retires at age 2"
  # Stil-Vorbilder (Kellan-Methode): Transkripte von 1-3 viralen Shorts der Nische hier einfuegen
  # (z.B. ueber youtubetotranscript.com). Das LLM uebernimmt Stil, Tempo und Laenge, nie den Inhalt.
  style_examples: []
  avoid:
    - danger, injury, violence
    - anything sexual or adult
    - real brands, logos, celebrities
    - mocking real parents or real babies

script:
  provider: "openai"
  openai_model: "gpt-5"
  claude_model: "claude-opus-5-5"
  target_seconds: 22             # Comedy: kurz und knackig
  max_seconds: 40
  words_per_second: 2.4

schedule:
  timezone: "Europe/Berlin"
  slots:
    - name: "morgen"
      time: "08:30"
      format: "scenes"
      series: "Baby of Wall Street"
      title_prefix: "POV: "
      focus: >
        A finance-boss situation: trading floor, boardroom, deals, bank, stock
        exchange, corner office. The gag is the contrast between ruthless money
        talk and baby logic (milk bottle instead of espresso, nap in the meeting,
        tantrum over the budget). Last scene is the punchline.
    - name: "abend"
      time: "20:30"
      format: "scenes"
      series: "Baby After Hours"
      title_prefix: "POV: "
      focus: >
        Bo off duty in normal adult life: gym, taxes, dating app, moving, cooking,
        airport, penthouse. Same character, same dry humor, punchline in the last scene.

scenes:
  count: 5                       # Szenen pro Short (jede = ein Bild + eine Caption)
  character: >
    Bo, the Baby of Wall Street – a chubby one-year-old baby, big brown eyes, one curly
    dark tuft of hair, rosy cheeks, a dimple on the left cheek. Signature look: tiny navy
    suit and tie. Always the same face; outfits change only when the situation needs it.

ranking:
  items: 3
  title_suffix: ""
  spoken_prefix: "Number {rank}."
  badge_label: "#{rank}"
  gap_seconds: 0.35

voice:
  # Trockener Erzaehler: en-US-BrianMultilingualNeural (casual) oder en-GB-RyanNeural (britisch-trocken)
  name: "en-GB-RyanNeural"
  rate: "+4%"
  pitch: "+0Hz"
  sentence_gap: 0.45             # laengere Pausen: der Gag braucht Luft

video:
  width: 1080
  height: 1920
  fps: 30
  background: "higgsfield"
  backgrounds_dir: "assets/backgrounds_baby"   # fuer Modus image/video: eigener Ordner je Kanal
  gradient_colors: ["#ffb347", "#ffcc33", "#ff8c69"]
  darken: 0.08                   # Comedy bleibt hell
  music_volume: 0.14             # assets/music: lockere, lizenzfreie Ukulele/Jazz-Loops
  outro_padding: 0.8

higgsfield:
  images_per_video: 5
  image_endpoint: "bytedance/seedream/v4/edit"       # Bild-zu-Bild mit Referenz (laut Console-Doku anpassen)
  image_arguments:
    aspect_ratio: "9:16"
    resolution: "2K"
  image_result_path: "images.0.url"
  # Wiederkehrende Figur: Referenzbild wird hochgeladen und bei jedem Bild mitgeschickt
  character_reference: "assets/character/baby_reference.png"
  image_reference_field: "image_urls"                # Feldname laut Modell-Doku
  image_reference_as_list: true
  character_description: "the same baby as in the reference image,"
  style_suffix: "photorealistic, bright natural lighting, comedic, vertical 9:16, no text, no letters, no watermark"
  video_endpoint: ""
  video_arguments: {}
  video_result_path: "video.url"
  video_seconds: 10

captions:
  font: "DejaVu Sans"
  size: 84
  words_per_line: 3
  max_chars: 18
  color: "#FFFFFF"
  highlight: "#FF3B7A"
  outline: "#000000"
  position: 0.78                 # Captions unten, Bild bleibt frei
  position_ranking: 0.78
  title_size: 76
  badge_size: 100
  badge_bg: "#FF3B7A"
  gold: "#FFC300"

youtube:
  privacy: "public"
  category_id: "23"              # 23 = Comedy
  made_for_kids: false           # Comedy fuer Erwachsene/Teens, nicht "fuer Kinder"
  default_tags: ["shorts", "aibaby", "babyofwallstreet", "babycomedy", "pov", "funny", "wallstreet"]
  publish_at: ""
  client_secret_file: "client_secret.json"
  token_file: "token_baby.json"  # eigener YouTube-Kanal = eigenes Token

# =====================================================================
#  Kanal 2: KI-Baby-Comedy (englisch, wiederkehrende Figur)
#  Start:  python make_short.py --config config.baby.yaml run --no-upload
# =====================================================================

channel:
  name: "Baby Has A Job"
  handle: "@BabyHasAJob"
  language: "en"
  audience: "allgemein"
  niche: >
    AI baby comedy with ONE recurring character: Bo, a chubby one-year-old who lives
    the life of a stressed adult. Every short is a "POV" situation (baby has a 9 to 5
    job, baby at the gym, baby as a chef, baby at a job interview, baby doing taxes,
    baby as a taxi driver). Dry, absurd, wholesome humor. Visual gags first, very few
    words. No cruelty, no danger for the baby, no adult themes, no brands.
  topics:
    - "POV: your baby has a 9 to 5 job"
    - "POV: your baby is the gym bro"
    - "POV: your baby is a head chef"
    - "POV: your baby has a job interview"
    - "POV: your baby is doing taxes"
    - "POV: your baby is a taxi driver"
    - "POV: your baby is a barista on Monday"
    - "POV: your baby is a wedding DJ"
    - "POV: your baby is a construction foreman"
    - "POV: your baby is a flight attendant"
    - "POV: your baby is a real estate agent"
    - "POV: your baby is a personal trainer"
    - "POV: your baby is a night shift security guard"
    - "POV: your baby is a food critic"
    - "POV: your baby is a firefighter (cat stuck in tree)"
    - "POV: your baby runs a lemonade empire"
    - "POV: your baby is a pizza delivery driver"
    - "POV: your baby is a school principal"
    - "POV: your baby is a detective"
    - "POV: your baby is a farmer at 5 a.m."
  avoid:
    - danger, injury, violence
    - anything sexual or adult
    - real brands, logos, celebrities
    - mocking real parents or real babies

script:
  provider: "openai"
  openai_model: "gpt-5"
  claude_model: "claude-opus-5-5"
  target_seconds: 22             # Comedy: kurz und knackig
  max_seconds: 40
  words_per_second: 2.4

schedule:
  timezone: "Europe/Berlin"
  slots:
    - name: "morgen"
      time: "08:30"
      format: "scenes"
      series: "Baby Has A Job"
      title_prefix: "POV: "
      focus: >
        A workday job situation: office, shop, restaurant, transport. The gag is the
        contrast between adult routine (coffee, meetings, deadlines) and baby logic
        (milk bottle, nap, tantrum). Last scene is the punchline.
    - name: "abend"
      time: "20:30"
      format: "scenes"
      series: "Baby Life"
      title_prefix: "POV: "
      focus: >
        A non-job adult situation: gym, dating app, taxes, moving apartment, cooking
        dinner, DIY, airport. Same character, same dry humor, punchline in the last scene.

scenes:
  count: 5                       # Szenen pro Short (jede = ein Bild + eine Caption)
  character: >
    Bo – a chubby one-year-old baby, big brown eyes, one curly dark tuft of hair,
    rosy cheeks, a dimple on the left cheek. Always the same face; outfits change
    with the job (tiny suit, chef hat, hi-vis vest ...).

ranking:
  items: 3
  title_suffix: ""
  spoken_prefix: "Number {rank}."
  badge_label: "#{rank}"
  gap_seconds: 0.35

voice:
  # Trockener Erzaehler: en-US-BrianMultilingualNeural (casual) oder en-GB-RyanNeural (britisch-trocken)
  name: "en-GB-RyanNeural"
  rate: "+4%"
  pitch: "+0Hz"
  sentence_gap: 0.45             # laengere Pausen: der Gag braucht Luft

video:
  width: 1080
  height: 1920
  fps: 30
  background: "higgsfield"
  backgrounds_dir: "assets/backgrounds_baby"   # fuer Modus image/video: eigener Ordner je Kanal
  gradient_colors: ["#ffb347", "#ffcc33", "#ff8c69"]
  darken: 0.08                   # Comedy bleibt hell
  music_volume: 0.14             # assets/music: lockere, lizenzfreie Ukulele/Jazz-Loops
  outro_padding: 0.8

higgsfield:
  images_per_video: 5
  image_endpoint: "bytedance/seedream/v4/edit"       # Bild-zu-Bild mit Referenz (laut Console-Doku anpassen)
  image_arguments:
    aspect_ratio: "9:16"
    resolution: "2K"
  image_result_path: "images.0.url"
  # Wiederkehrende Figur: Referenzbild wird hochgeladen und bei jedem Bild mitgeschickt
  character_reference: "assets/character/baby_reference.png"
  image_reference_field: "image_urls"                # Feldname laut Modell-Doku
  image_reference_as_list: true
  character_description: "the same baby as in the reference image,"
  style_suffix: "photorealistic, bright natural lighting, comedic, vertical 9:16, no text, no letters, no watermark"
  video_endpoint: ""
  video_arguments: {}
  video_result_path: "video.url"
  video_seconds: 10

captions:
  font: "DejaVu Sans"
  size: 84
  words_per_line: 3
  max_chars: 18
  color: "#FFFFFF"
  highlight: "#FF3B7A"
  outline: "#000000"
  position: 0.78                 # Captions unten, Bild bleibt frei
  position_ranking: 0.78
  title_size: 76
  badge_size: 100
  badge_bg: "#FF3B7A"
  gold: "#FFC300"

youtube:
  privacy: "public"
  category_id: "23"              # 23 = Comedy
  made_for_kids: false           # Comedy fuer Erwachsene/Teens, nicht "fuer Kinder"
  default_tags: ["shorts", "aibaby", "babycomedy", "pov", "funny", "ai"]
  publish_at: ""
  client_secret_file: "client_secret.json"
  token_file: "token_baby.json"  # eigener YouTube-Kanal = eigenes Token

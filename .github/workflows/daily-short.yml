name: Daily YouTube Short

on:
  schedule:
    # 3 Uploads pro Tag. Cron ist UTC; Berlin = UTC+2 (Sommer) / UTC+1 (Winter).
    # Slots aus config.yaml: morgen 07:15, nachmittag 15:30, abend 18:30 (Berlin, Sommerzeit).
    - cron: "15 5 * * *"    # morgen
    - cron: "30 13 * * *"   # nachmittag
    - cron: "30 16 * * *"   # abend
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot (morgen | nachmittag | abend | auto)"
        type: string
        default: "auto"
      upload:
        description: "Auf YouTube hochladen?"
        type: boolean
        default: true

permissions:
  contents: write   # damit state/history.json zurueck ins Repo geschrieben wird

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shorts-factory
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_KEY: ${{ secrets.HF_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts-factory/requirements.txt

      - name: ffmpeg installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt

      - name: Short erzeugen & hochladen
        run: |
          ARGS=""
          SLOT="${{ inputs.slot }}"
          if [ -n "$SLOT" ] && [ "$SLOT" != "auto" ]; then ARGS="$ARGS --slot $SLOT"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          # Ohne --slot waehlt das Skript den Slot anhand der Uhrzeit (Europe/Berlin).
          python make_short.py run $ARGS

      - name: Video als Artifact sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            shorts-factory/output/*.mp4
            shorts-factory/scripts/*.json
          retention-days: 14

      - name: Verlauf committen
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/history.json scripts/*.json
          git diff --cached --quiet || git commit -m "chore: Short vom $(date -u +%Y-%m-%d) eingetragen"
          git push

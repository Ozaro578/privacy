name: App Android (Play Console intern)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web-Hülle und Android-Projekt synchronisieren
        run: |
          npm ci
          npx cap sync android
      - name: Signatur-Schlüssel ablegen (wenn vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/zukkabro-upload.jks; echo "Schlüssel abgelegt"; else echo "Kein Schlüssel, Build bleibt unsigniert"; fi
      - name: App Bundle bauen
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: AAB als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: ZUKKABRO-android
          path: app/android/app/build/outputs/bundle/release/*.aab
      - name: Play-Zugang prüfen
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "vorhanden=$([ -n "$PLAY_JSON" ] && echo ja || echo nein)" >> "$GITHUB_OUTPUT"
      - name: Zu Google Play (interner Test) hochladen
        if: steps.play.outputs.vorhanden == 'ja'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.zukkabro.app
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

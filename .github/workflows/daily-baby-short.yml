name: Daily Baby Short (Kanal 2)

on:
  schedule:
    # 2 Uploads pro Tag (UTC). Slots aus config.baby.yaml: 08:30 + 20:30 Berlin (Sommerzeit).
    - cron: "30 6 * * *"    # morgen
    - cron: "30 18 * * *"   # abend
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot (morgen | abend | auto)"
        type: string
        default: "auto"
      upload:
        description: "Auf YouTube hochladen?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-baby-short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shorts-factory
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HF_KEY: ${{ secrets.HF_KEY }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON_BABY }}   # eigener Kanal = eigenes Token
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts-factory/requirements.txt
      - name: ffmpeg installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Abhaengigkeiten
        run: pip install -r requirements.txt
      - name: Short erzeugen & hochladen
        run: |
          ARGS=""
          SLOT="${{ inputs.slot }}"
          if [ -n "$SLOT" ] && [ "$SLOT" != "auto" ]; then ARGS="$ARGS --slot $SLOT"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          python make_short.py --config config.baby.yaml run $ARGS
      - name: Video als Artifact sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baby-short-${{ github.run_number }}
          path: |
            shorts-factory/output/*.mp4
            shorts-factory/scripts/*.json
          retention-days: 14
      - name: Verlauf committen
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add state/ scripts/*.json
          git diff --cached --quiet || git commit -m "chore: Baby-Short vom $(date -u +%Y-%m-%d) eingetragen"
          git push

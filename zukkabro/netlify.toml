# Netlify-Konfiguration für ZUKKABRO
# public/                  -> statische Webseite (wird veröffentlicht)
# netlify/functions/       -> Server-Funktionen (Admin-Login, Buchhaltung)
# netlify/edge-functions/  -> Zugangsschutz für die ganze Seite
[build]
  publish = "public"
  command = ""

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

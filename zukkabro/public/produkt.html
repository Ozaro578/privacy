  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    /* Bildplätze: fehlt ein Bild, wird die nachgebaute Version gezeigt */
    window.addEventListener("error", function (e) {
      var t = e.target;
      if (!t || t.tagName !== "IMG") return;
      if (t.dataset.fallback && t.src.indexOf(t.dataset.fallback) === -1) { t.src = t.dataset.fallback; return; }
      if (t.hasAttribute("data-slot")) { var b = t.closest("[data-slot-box]"); if (b) b.classList.add("no-img"); t.remove(); }
    }, true);
  </script>
</head>
<body data-seite="sortiment">

  <main>

          <h2>Das könnte dir auch <span class="drip">schmecken</span></h2>
        </header>
        <div class="products" id="aehnlichListe"></div>
      </div>
    </section>
  </main>

  <div id="layout-unten"></div>
  <script src="/assets/js/shop.js"></script>

  <script src="/assets/js/produkt.js"></script>
</body>

  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    /* Bildplätze: fehlt ein Bild, wird die nachgebaute Version gezeigt */
    window.addEventListener("error", function (e) {
      var t = e.target;
      if (!t || t.tagName !== "IMG") return;
      if (t.dataset.fallback && t.src.indexOf(t.dataset.fallback) === -1) { t.src = t.dataset.fallback; return; }
      if (t.hasAttribute("data-slot")) { var b = t.closest("[data-slot-box]"); if (b) b.classList.add("no-img"); t.remove(); }
    }, true);
  </script>
</head>
<body data-seite="pakete">
  <div id="layout-oben"></div>

  <main>
    <section class="page-head pattern">

      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="pakete" data-pakete="liste"></div>
      </div>
    </section>
  </main>

  <div id="layout-unten"></div>
  <script src="/assets/js/shop.js"></script>
  <script src="/assets/js/produkte.js"></script>
  <script src="/assets/js/pakete.js"></script>
</body>
</html>

# Netlify: statische App + Functions. Quellcode liegt in briefklar/.
[build]
  base = "briefklar"
  command = "npm run build -w @briefklar/shared && npm run build -w @briefklar/web"
  publish = "apps/web/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# SPA-Fallback (Functions haben Vorrang, da sie eigene Pfade registrieren)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
